packages:
  - 'packages/*'
  - 'examples/*'

autoDedupe: true
lockfile:
  includeResolutionSettings: true

catalogMode: prefer

catalog:
  '@types/node': ^26.6.11
  '@vitest/browser-playwright': ^5.1.2
  playwright: ^1.65.1
  react-concurrent-store: 0.0.1
  rxjs: ^7.8.2
  typescript: 7.0.2
  zod: ^4.6.7

allowBuilds:
  esbuild: false

# Sanity-owned packages and their build tooling release often; don't gate them on the default
# minimum release age.
minimumReleaseAgeExclude:
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@oxlint-tsgolint/*'
  - '@sanity/*'
  - '@sanity-labs/*'
  - '@tsdown/*'
  - oxfmt
  - oxlint
  - oxlint-tsgolint
  - publint
  - tsdown
  - xstate
  - '@types/node@26.6.11'

# `pnpm update` writes a changeset when it changes a published package's runtime dependencies.
update:
  changeset: true
